<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Student Information</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Alice</td>
                <td>20</td>
                <td>Computer Science</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Bob</td>
                <td>21</td>
                <td>Mechanical Engineering</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Charlie</td>
                <td>19</td>
                <td>Electronics</td>
            </tr>
            <tr>
                <td>104</td>
                <td>Diana</td>
                <td>22</td>
                <td>Information Technology</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
</body>
</html>
